name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - dev

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-k8s-todo:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/my-k8s-todo:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Setup kubeconfig for GKE
        run: |
          mkdir -p $HOME/.kube
          cat <<EOF > $HOME/.kube/config
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              certificate-authority-data: ${{ secrets.KUBE_CA_CERT }}
              server: ${{ secrets.KUBE_SERVER }}
            name: gke-cluster
          contexts:
          - context:
              cluster: gke-cluster
              user: github-actions
            name: github-actions-context
          current-context: github-actions-context
          users:
          - name: github-actions
            user:
              token: ${{ secrets.KUBE_TOKEN }}
          EOF

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
