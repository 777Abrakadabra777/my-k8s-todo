apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-actions-binding
roleRef:
  kind: ClusterRole
  name: edit  # или "admin", если нужно больше прав
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: github-actions-sa
    namespace: default

